    - Detect Motion with the IMU: 2_tiny-core/basics/detect-motion.md
    - Save Data to the SD Card: 2_tiny-core/basics/save-data-to-sdcard.md
    - Connect a Display via I2C: 2_tiny-core/basics/i2c-display.md
    - Use the Serial Monitor & Plotter: 2_tiny-core/basics/serial-monitor-plotter.md
    - Connect to WiFi: 2_tiny-core/basics/wifi.md
    - Connect to Bluetooth: 2_tiny-core/basics/bluetooth.md
