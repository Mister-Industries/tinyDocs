      - Use a Controller: 2_tiny-core/advanced/dabble-app-controller.md
      #- Move a Servo Motor: 2_tiny-core/advanced/dabble-app-servo.md

      #BACKLOG
      #- Run AI Models (tinyML): 2_tiny-core/advanced/tinyML.md
      #- Pretend to be a Keyboard: 2_tiny-core/advanced/keyboard.md
      #- Make a MIDI Instrument: 2_tiny-core/advanced/midi-instrument.md
      #- Use USB Mass Storage: 2_tiny-core/advanced/usb-mass-storage.md
      #- Use Smart Home: 2_tiny-core/advanced/esp-smart-home.md

  #- tinyHATs:
    #- 3_tiny-hats/index.md
    #- tinyGlow: 3_tiny-hats/tinyGlow.md
    #- tinyVoice: 3_tiny-hats/tinyVoice.md
    #- tinyDisplay: 3_tiny-hats/tinyDisplay.md
    #- tinySniff: 3_tiny-hats/tinySniff.md
    #- tinyProto: 3_tiny-hats/tinyProto.md
    #- tinyMove: 3_tiny-hats/tinyMove.md

  - Reference:
    - 5_reference/index.md
    
    - Basics:
      - What is GPIO?: 5_reference/basics/gpio.md
      - What is I2C?: 5_reference/basics/i2c.md
      - What is an IMU?: 5_reference/basics/imu.md
      - What is Serial Communication?: 5_reference/basics/serial-communication.md
