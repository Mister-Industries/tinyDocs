      - What is I2S?: 5_reference/advanced/i2s.md
      - What is an ADC?: 5_reference/advanced/adc.md
      - What is a DAC?: 5_reference/advanced/dac.md
      - What is DMA/FastADC?: 5_reference/advanced/dma-fastadc.md
      - What is WiFi?: 5_reference/advanced/wifi.md
      - What is Bluetooth?: 5_reference/advanced/bluetooth.md
      - What is PWM?: 5_reference/advanced/pwm.md
      #- What is HID?: 5_reference/advanced/hid.md
      #- What is MIDI?: 5_reference/advanced/midi.md
      #- What is tinyML?: 5_reference/advanced/tinyml.md

    - FAQ: 5_reference/FAQ.md

  - User Projects: 
    - 6_user-projects/index.md
    - Motion Tracker: 6_user-projects/motion-tracker.md    

  - Blog: 7_blog/index.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      auto_title: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

