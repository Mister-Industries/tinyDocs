site_name: tinyDocs
site_url: https://docs.mr.industries/
repo_url: https://github.com/Mister-Industries/tinyCore
repo_name: Mister-Industries/tinyCore
theme:  
  favicon: 'assets/images/favicon.ico'
  logo: 'assets/images/tinyLogoWhite.png'
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to Light Mode
      primary: blue
      accent: purple

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to Dark Mode
      primary: blue
      accent: purple
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - navigation.footer
    #- navigation.sections
    - navigation.indexes
    - search.suggest
    - content.footnote.tooltips
    - content.code.copy
    - content.code.line_numbers

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

watch:
    - overrides

plugins:
    - search
    - blog: 
        authors_profiles: true
        authors_profiles_name: Authors
        archive: true
        archive_date_format: yyyy
        archive_name: Archive
        archive_pagination: true
        categories: true
    #- live-edit
    

nav:
  - Home: index.md
  
  - Get Started: 
    - setup/index.md
    - Unboxing: setup/unboxing.md
    - Setup Arduino IDE: setup/arduino-ide.md
    - Setup the IMU: setup/imu.md
    - Your First Application: setup/motion-tracker.md
  
  - Core: 
    - core/index.md
    - Basics:
      - Using GPIO: core/gpio.md
      - Using the IMU: core/imu.md
      - Blinking an LED: core/blink-led.md
      - Using the SD Card: core/sdcard.md
      - Using the Serial Monitor & Plotter: core/serial.md
      - Using I2C: core/i2c.md
      - Linking two tinyCores: core/link-tiny-core.md
      - Using tinyProto: core/tinyProto.md
    - Advanced: core/advanced/index.md

  - Expansions:
    - expansions/index.md
    - tinyGlow: expansions/tinyGlow.md
    - tinyVoice: expansions/tinyVoice.md
    - tinyDisplay: expansion/tinyDisplay.md
    - tinySniff: expansion/tinySniff.md
    - tinyProto: expansion/tinyProto.md
    - tinyMove: expansion/tinyMove.md

  - Reference:
    - reference/index.md

  - User Projects: 
    - user-projects/index.md
    - Motion Tracker: user-projects/motion-tracker.md    

  - Blog: blog/index.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      auto_title: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra:
  social:
    - icon: simple/youtube
      link: https://www.youtube.com/@FacioErgoSum
    - icon: simple/bluesky
      link: https://bsky.app/profile/mr.industries
    - icon: simple/notion
      link: https://emphasized-crop-755.notion.site/
    - icon: material/linkedin
      link: https://www.linkedin.com/company/mister-industries
  analytics:
    provider: google
    property: G-93QSYCNXQS
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
copyright: >
  Copyright &copy; 2025 MR.INDUSTRIES LLC –
  <a href="#__consent">Change cookie settings</a>