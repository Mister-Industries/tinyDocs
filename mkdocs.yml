site_name: tinyDocs
site_url: https://docs.mr.industries/
repo_url: https://github.com/Mister-Industries/tinyCore
repo_name: Mister-Industries/tinyCore
theme:  
  favicon: 'assets/images/favicon.ico'
  logo: 'assets/images/tinyLogoWhite.png'
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue
      accent: purple
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - content.footnote.tooltips
    - content.code.copy
    - content.code.line_numbers

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

watch:
    - overrides

plugins:
    - search
    - blog: 
        authors_profiles: true
        authors_profiles_name: Authors
        archive: true
        archive_date_format: yyyy
        archive_name: Archive
        archive_pagination: true
        categories: true
        blog_dir: 7_blog
    #- live-edit
    

nav:
